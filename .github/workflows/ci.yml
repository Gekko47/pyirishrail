name: CI

# Single-job CI: lint + strict mypy + pytest with 100% line coverage.
# The async client library is bundled inside the integration at
# ``custom_components/irish_rail/pyirishrail/`` and is tested as part
# of the integration suite (see tests/components/irish_rail/test_client.py
# and test_client_gate.py). ``hassfest`` validates manifest.json.

on:
  push:
    branches: [master]
    tags:
      - "v*"
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  hassfest:
    name: hassfest (manifest validation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: hassfest
        uses: home-assistant/actions/hassfest@master

  integration:
    name: irish_rail (integration)
    runs-on: ubuntu-latest
    needs: hassfest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dev tooling
        run: |
          python -m pip install --upgrade pip
          pip install \
            pytest pytest-asyncio pytest-cov aresponses \
            pytest-homeassistant-custom-component \
            "ruff>=0.16" mypy

      # D4: the stale-patch-target grep guard. Phase 1 of the v0.3.0
      # Clean Baseline retargeted 117 ``patch("pyirishrail.*"...)`` test
      # targets to the vendored package; this guard fails the build
      # the moment a future hand-edit reintroduces the old top-level
      # name, so the issue cannot reappear silently. The integration's
      # own ``pyirishrail/`` package is the only legitimate ``pyirishrail``
      # import, and the tests patch it through the full
      # ``custom_components.irish_rail.pyirishrail`` path. ``grep -Pnz``
      # matches across the arbitrary whitespace that Python allows
      # between ``patch(`` and the quoted target string.
      - name: Guard against stale pyirishrail patch targets
        run: |
          if grep -Pnzq 'patch\s*\(\s*["\x27]pyirishrail\.' tests/components/irish_rail; then
            echo "::error::stale 'pyirishrail.X' patch target found in tests; use 'custom_components.irish_rail.pyirishrail.X' instead"
            grep -Pnz 'patch\s*\(\s*["\x27]pyirishrail\.' tests/components/irish_rail
            exit 1
          fi

      - name: Ruff lint (integration + tests)
        run: ruff check custom_components/irish_rail tests/components/irish_rail scripts

      # mypy covers the integration *and* its tests, mirroring the
      # home-assistant/core ``.strict-typing`` convention. The bundled
      # ``pyirishrail/`` client module is included in the strict run.
      - name: Mypy strict (integration + tests)
        run: mypy custom_components/irish_rail tests/components/irish_rail

      - name: Pytest (integration) with coverage
        run: |
          pytest \
            tests/components/irish_rail \
            tests/test_win_stubs.py \
            --cov=custom_components/irish_rail \
            --cov-fail-under=100
