name: CI

# Single-job CI: lint + strict mypy + pytest with 100% line coverage.
# The async client library is part of the integration
# (``custom_components/irish_rail/client.py``,
# ``request_gate.py``, ``models.py``, ``errors.py``, ``lib_const.py``)
# and is tested as part of the integration suite
# (see tests/components/irish_rail/test_client.py and test_client_gate.py).
# ``hassfest`` validates manifest.json.

on:
  push:
    branches: [master]
    tags:
      - "v*"
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  hassfest:
    name: hassfest (manifest validation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: hassfest
        uses: home-assistant/actions/hassfest@master

  integration:
    name: irish_rail (integration)
    runs-on: ubuntu-latest
    needs: hassfest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dev tooling
        run: |
          python -m pip install --upgrade pip
          pip install \
            pytest pytest-asyncio pytest-cov aresponses \
            pytest-homeassistant-custom-component \
            "ruff>=0.16" mypy

      # D4: the stale-patch-target grep guard. Phase 1 of the v0.3.0
      # Clean Baseline retargeted 117 ``patch("pyirishrail.*"...)`` test
      # targets to the vendored package; the streamline Phase B1
      # (2026-09-01) collapsed the sub-package into the integration,
      # so the legacy guard now checks for the obsolete
      # ``pyirishrail.*`` patch target and fails the build the
      # moment a future hand-edit reintroduces it. The valid path
      # is now ``custom_components.irish_rail.client.IrishRailClient.X``
      # (the class lives directly in ``client.py``). ``grep -Pnz``
      # matches across the arbitrary whitespace that Python allows
      # between ``patch(`` and the quoted target string.
      - name: Guard against stale pyirishrail patch targets
        run: |
          if grep -Pnzq 'patch\s*\(\s*["\x27]pyirishrail\.' tests/components/irish_rail; then
            echo "::error::stale 'pyirishrail.X' patch target found in tests; use 'custom_components.irish_rail.client.IrishRailClient.X' instead"
            grep -Pnz 'patch\s*\(\s*["\x27]pyirishrail\.' tests/components/irish_rail
            exit 1
          fi

      - name: Ruff lint (integration + tests)
        run: ruff check custom_components/irish_rail tests/components/irish_rail scripts

      # Streamline roadmap gate (Phase A acceptance):
      # docstring density must stay at or below 0.20 lines per source
      # LOC during Phase A and 0.15 after Phase A completes. The
      # streamline-roadmap also bans "Skill N" / "Phase N" / "roadmap N"
      # cross-references in source (those are project-internal
      # scratchpad breadcrumbs that belong in the active roadmap file).
      # See .cline/streamline-roadmap.md Phase A and
      # .cline/skills/10-streamline-execution.md §1.
      - name: Docstring density + project-internal reference gate
        run: |
          python - <<'PY'
          import re, sys
          from pathlib import Path
          root = Path("custom_components/irish_rail")
          py_files = [p for p in root.rglob("*.py") if "__pycache__" not in p.parts]
          total_loc = 0
          total_doc = 0
          for p in py_files:
              text = p.read_text(encoding="utf-8")
              loc = sum(1 for _ in text.splitlines() if _.strip())
              doc = sum(
                  len(m.group(1).splitlines())
                  for m in re.finditer(r'"""(.*?)"""', text, re.DOTALL)
              )
              total_loc += loc
              total_doc += doc
          density = total_doc / total_loc if total_loc else 0
          print(f"docstring lines: {total_doc}  source LOC: {total_loc}  density: {density:.3f}")
          # Phase A intermediate gate; tighten to 0.15 in a later commit
          # once Phase A lands.
          if density > 0.20:
              sys.exit(
                  f"docstring density {density:.3f} exceeds the Phase A gate of 0.20; "
                  f"see .cline/streamline-roadmap.md Phase A"
              )
          # Project-internal cross-references belong in the active
          # roadmap file, not in source.
          offenders: list[str] = []
          for p in py_files:
              for i, line in enumerate(p.read_text(encoding="utf-8").splitlines(), 1):
                  if re.search(r"\b(Skill\s+\d+|Phase\s+\d|roadmap\s+\d\.\d|roadmap\s+\d\.)", line):
                      offenders.append(f"{p}:{i}: {line.rstrip()}")
          if offenders:
              for o in offenders:
                  print(o)
              sys.exit(
                  "project-internal cross-reference(s) found in source; "
                  "delete the reference or replace with a docs/architecture.md pointer"
              )
          PY

      # mypy covers the integration *and* its tests, mirroring the
      # home-assistant/core ``.strict-typing`` convention. The
      # framework-agnostic client modules
      # (``client.py`` / ``request_gate.py`` / ``models.py`` /
      # ``errors.py`` / ``lib_const.py``) are included in the
      # strict run via the package root.
      - name: Mypy strict (integration + tests)
        run: mypy custom_components/irish_rail tests/components/irish_rail

      - name: Pytest (integration) with coverage
        run: |
          pytest \
            tests/components/irish_rail \
            tests/test_win_stubs.py \
            --cov=custom_components/irish_rail \
            --cov-fail-under=100
