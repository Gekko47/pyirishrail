name: CI

# Single-job CI: lint + strict mypy + pytest with 100% line and branch
# coverage. The async client library is part of the integration
# (``custom_components/irish_rail/client.py``,
# ``request_gate.py``, ``models.py``, ``errors.py``, ``lib_const.py``)
# and is tested as part of the integration suite
# (see tests/components/irish_rail/test_client.py and test_client_gate.py).
# ``hassfest`` validates manifest.json.
#
# The source-hygiene gate (docstring density, project-internal
# cross-references, backticked module pointers) lives in
# ``scripts/check_streamline_a4.py`` so it is runnable, typed and
# covered outside CI rather than embedded in a heredoc here.

on:
  push:
    branches: [master]
    tags:
      - "v*"
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  hassfest:
    name: hassfest (manifest validation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # NOT YET SHA-PINNED: this is the one mutable action reference left
      # in the repository. Pinning it needs the commit id of the tag,
      # which cannot be resolved without network access to the upstream
      # repository; it is recorded as an open item in the active roadmap
      # rather than guessed at.
      - name: hassfest
        uses: home-assistant/actions/hassfest@master

  release:
    name: release version consistency (tags only)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # A tag that disagrees with manifest.json ships a version the user
      # sees and a version that was tested being two different things.
      - name: manifest / CHANGELOG / tag agree
        run: python scripts/check_release_version.py "$GITHUB_REF_NAME"

  integration:
    name: irish_rail (integration)
    runs-on: ubuntu-latest
    needs: hassfest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # Every tool is pinned exactly. 0.13.356 is the first
      # pytest-homeassistant-custom-component whose own requirement
      # (``homeassistant==2026.8.2``) is at or above the ``hacs.json``
      # floor; the previous pin (0.13.290) required
      # ``homeassistant==2025.11.0b0`` — a 2025.11 *beta*, so CI was not
      # exercising the HA version this integration declares support for.
      # pytest-timeout is not optional: without it a wedged gate or a
      # sleeping fake clock hangs the run instead of failing it.
      - name: Install dev tooling
        run: |
          python -m pip install --upgrade pip
          pip install \
            "pytest==9.0.3" \
            "pytest-asyncio==1.4.0" \
            "pytest-cov==7.1.0" \
            "pytest-timeout==2.4.0" \
            "aresponses==3.0.0" \
            "coverage==7.15.2" \
            "pytest-homeassistant-custom-component==0.13.356" \
            "ruff==0.16.4" \
            "mypy==2.3.1"

      # D4: the stale-patch-target grep guard. Phase 1 of the v0.3.0
      # Clean Baseline retargeted 117 ``patch("pyirishrail.*"...)`` test
      # targets to the vendored package; the streamline Phase B1
      # (2026-09-01) collapsed the sub-package into the integration,
      # so the legacy guard now checks for the obsolete
      # ``pyirishrail.*`` patch target and fails the build the
      # moment a future hand-edit reintroduces it. The valid path
      # is now ``custom_components.irish_rail.client.IrishRailClient.X``
      # (the class lives directly in ``client.py``). ``grep -Pnz``
      # matches across the arbitrary whitespace that Python allows
      # between ``patch(`` and the quoted target string.
      - name: Guard against stale pyirishrail patch targets
        run: |
          if grep -Pnzq 'patch\s*\(\s*["\x27]pyirishrail\.' tests/components/irish_rail; then
            echo "::error::stale 'pyirishrail.X' patch target found in tests; use 'custom_components.irish_rail.client.IrishRailClient.X' instead"
            grep -Pnz 'patch\s*\(\s*["\x27]pyirishrail\.' tests/components/irish_rail
            exit 1
          fi

      # Structural guard for the RuntimeRegistry invariant
      # (docs/architecture.md §11): _runtime.py is the only module allowed
      # to read or write hass.data[DOMAIN]. Every other module goes through
      # the registry's session-key accessors. This makes the invariant
      # enforced by the build rather than by convention.
      - name: Guard the hass.data[DOMAIN] single-writer invariant
        run: |
          offenders=$(grep -rnE 'hass\.data(\.setdefault\(|\.get\(|\[)[^)]*DOMAIN' \
            custom_components/irish_rail \
            --include='*.py' \
            | grep -v '_runtime\.py' \
            | grep -vE ':\s*#' || true)
          if [ -n "$offenders" ]; then
            echo "::error::hass.data[DOMAIN] accessed outside _runtime.py; use the registry accessors"
            echo "$offenders"
            exit 1
          fi
          echo "OK: hass.data[DOMAIN] is only touched by _runtime.py"

      - name: Ruff lint (integration + tests + scripts)
        run: ruff check custom_components/irish_rail tests/components/irish_rail tests/test_scripts.py scripts

      # Docstring density, project-internal cross-references and
      # backticked module pointers. See scripts/check_streamline_a4.py
      # and .cline/streamline-roadmap.md Phase A.
      - name: Source hygiene (density, cross-references, module pointers)
        run: python scripts/check_streamline_a4.py

      # mypy covers the integration, its tests and the build gates,
      # mirroring the home-assistant/core ``.strict-typing``
      # convention. The framework-agnostic client modules
      # (``client.py`` / ``request_gate.py`` / ``models.py`` /
      # ``errors.py`` / ``lib_const.py``) are included in the
      # strict run via the package root.
      - name: Mypy strict (integration + tests + scripts)
        run: mypy custom_components/irish_rail tests/components/irish_rail tests/test_scripts.py scripts

      - name: Pytest (integration) with coverage
        run: |
          pytest \
            tests/components/irish_rail \
            tests/test_scripts.py \
            tests/test_win_stubs.py \
            --cov=custom_components/irish_rail \
            --cov=scripts \
            --cov-branch \
            --cov-fail-under=100
