# The async client lives inside the integration at
# ``custom_components/irish_rail/`` as a set of framework-agnostic
# modules (``client.py``, ``request_gate.py``, ``models.py``,
# ``errors.py``, ``lib_const.py``; no separate package layout,
# no wheel build). This file is therefore intentionally minimal: it
# only configures the development tooling that needs to know where
# source and tests live. The integration itself is loaded by HACS
# directly from the directory tree; ``manifest.json`` is the source
# of truth for the integration's runtime dependencies.

[tool.coverage.report]
# Gold-tier target: full statement coverage across the integration.
# Mirrors the --cov-fail-under=100 gate enforced in
# .github/workflows/ci.yml.
fail_under = 100

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_configs = true
show_error_codes = true
# Distinguish ``custom_components/irish_rail`` from
# ``tests/components/irish_rail`` by their full directory path instead
# of treating both as top-level "irish_rail".
explicit_package_bases = true
exclude = [
    "^venv/",
]

[[tool.mypy.overrides]]
module = [
    "pytest_homeassistant_custom_component.*",
    "aresponses",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
# ``tests/win_stubs`` must load *before* the entry-point plugins
# (notably ``pytest-homeassistant-custom-component``) because the
# latter imports ``homeassistant.runner``, which on Windows pulls in
# the POSIX-only ``fcntl`` module. The shim is a no-op on non-Windows
# platforms so it is safe to load unconditionally here.
addopts = "-p tests.win_stubs"
testpaths = [
    "tests",
]
pythonpath = [
    ".",
]
asyncio_mode = "auto"
