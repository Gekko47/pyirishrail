[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyirishrail"
version = "0.2.0"
description = "Async client library for the Irish Rail RTPI realtime API"
readme = "pyirishrail/README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
authors = [
    { name = "Gekko47" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Framework :: Home Assistant",
    "Typing :: Typed",
]
dependencies = [
    "aiohttp>=3.9.0",
    "defusedxml>=0.7.1",
]

[tool.setuptools]
# The Home Assistant integration under ``custom_components/`` is loaded
# from disk by HACS and is *not* an installable Python package — HACS
# reads the directory layout, not ``pip``. Only the ``pyirishrail``
# library is published as a wheel; its private ``_const`` module ships
# inline (no package-data glob needed) and the PEP-561 ``py.typed``
# marker is included via [tool.setuptools.package-data] below.
packages = ["pyirishrail"]
include-package-data = true

[tool.setuptools.package-data]
pyirishrail = ["py.typed"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-homeassistant-custom-component>=0.13.0",
    "pytest-asyncio>=0.23.0",
    "aresponses>=3.0.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "aiohttp>=3.9.0",
    "types-defusedxml>=0.7.0",
    "build>=1.0.0",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "ASYNC",# flake8-async
    "I",    # isort (import ordering, enforced by HA core)
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "RET",  # flake8-return
    "RUF",  # ruff-specific rules
    "T20",  # flake8-print (no print statements)
]
ignore = []

[tool.ruff.lint.isort]
force-sort-within-sections = true
combine-as-imports = true

[tool.coverage.report]
# Gold-tier target: full statement coverage across the integration.
# Mirrors the --cov-fail-under=100 gate enforced in .github/workflows/ci.yml.
fail_under = 100

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_configs = true
show_error_codes = true
# Distinguish custom_components/irish_rail from tests/components/irish_rail
# by their full directory path instead of treating both as top-level "irish_rail".
explicit_package_bases = true
exclude = [
    "^venv/",
]

[[tool.mypy.overrides]]
module = [
    "pytest_homeassistant_custom_component.*",
    "aresponses",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-p tests.win_stubs"
testpaths = [
    "tests",
]
pythonpath = [
    "."
]
asyncio_mode = "auto"
