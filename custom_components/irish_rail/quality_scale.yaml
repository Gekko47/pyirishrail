# Irish Rail — HA Quality Scale (Bronze / Silver / Gold / Platinum).
# Rule IDs: underscore form of the official hyphenated names. Statuses:
#   done   — evidenced by a file/function pointer in the comment; long-form
#            rationale lives in docs/architecture.md (or CHANGELOG.md for
#            per-phase history) and is not duplicated here.
#   exempt — the rule's own exception clause applies; one-line justification.
#   todo   — assessed but not yet satisfied; tracked in the active roadmap.

rules:
  # Bronze
  action_setup: {status: exempt, comment: Read-only integration; no service actions to register.}
  appropriate_polling: {status: done, comment: const.py DEFAULT_SCAN_INTERVAL (60s) via DataUpdateCoordinator; user-adjustable 30s–10min via options flow. See docs/architecture.md §9.}
  brands: {status: done, comment: brand/icon.png, brand/logo.png, brand/small.png ship with the integration.}
  common_modules: {status: done, comment: Framework-agnostic client modules (client.py, request_gate.py, models.py, errors.py, lib_const.py) sit alongside the HA integration code; shared entity base in entity.py; types.py holds IrishRailRuntimeData + IrishRailConfigEntry. See docs/architecture.md §1, §4.}
  config_flow_test_coverage: {status: done, comment: tests/components/irish_rail/test_config_flow.py covers success, cannot_connect, invalid_station, duplicate-abort paths.}
  config_flow: {status: done, comment: IrishRailConfigFlow.async_step_user in config_flow.py.}
  reconfiguration_flow: {status: done, comment: IrishRailConfigFlow.async_step_reconfigure in config_flow.py; same-direction preserves unique ID. See docs/architecture.md §8.}
  dependency_transparency: {status: done, comment: 'manifest.json requirements: []; XML parsed by stdlib xml.etree.ElementTree; transport is aiohttp (HA core, no listing). Pinned by a test asserting requirements is empty. See docs/architecture.md §4.'}
  docs_actions: {status: done, comment: 'README "Actions" section.'}
  docs_conditions: {status: done, comment: 'README "Conditions" section.'}
  docs_high_level_description: {status: done, comment: 'README "Description" section.'}
  docs_installation_instructions: {status: done, comment: 'README "Installation" section (HACS + manual); no API key needed.'}
  docs_removal_instructions: {status: done, comment: 'README "Removal" section.'}
  docs_triggers: {status: done, comment: 'README "Triggers" section: startup refresh + 60s polling.'}
  entity_event_setup: {status: done, comment: sensor/binary_sensor/button entities extend CoordinatorEntity; lifecycle subscription handled by the base.}
  entity_unique_id: {status: done, comment: entity.py builds unique IDs from config_entry.unique_id + per-entity suffix; the two integration-level entities use fixed identifiers. See docs/architecture.md §6.}
  has_entity_name: {status: done, comment: entity.py sets _attr_has_entity_name = True on the base class.}
  runtime_data: {status: done, comment: __init__.py stores IrishRailRuntimeData (client + coordinator) on entry.runtime_data; types.py defines the container and IrishRailConfigEntry alias.}
  test_before_configure: {status: done, comment: config_flow.py validates connection by fetching the station list before allowing entry creation; failures map to cannot_connect.}
  test_before_setup: {status: done, comment: __init__.py awaits coordinator.async_config_entry_first_refresh(), raising ConfigEntryNotReady on failure. See docs/architecture.md §12.}
  unique_config_entry: {status: done, comment: 'config_flow.py sets unique_id = "{station_code}_{direction}"; reconfigures to the same direction preserve the existing ID. See docs/architecture.md §8.'}

  # Silver
  parallel_updates: {status: done, comment: sensor.py declares PARALLEL_UPDATES = 0; coordinator-based read-only platform, per-entity updates are pure property reads. See docs/architecture.md §15.}
  log_when_unavailable: {status: done, comment: coordinator.py raises UpdateFailed on IrishRailError; the built-in DataUpdateCoordinator handles the success-to-failure and recovery log transitions. Pinned by transition tests in test_coordinator.py.}
  entity_unavailable: {status: done, comment: Entities extend CoordinatorEntity so availability follows the coordinator result; test_sensor.py asserts the IrishRailError -> UpdateFailed -> unavailable path and recovery.}
  config_entry_unloading: {status: done, comment: __init__.py async_unload_entry calls async_unload_platforms; update listener registered through entry.async_on_unload. See docs/architecture.md §12.}
  test_coverage: {status: done, comment: CI gate --cov-fail-under=100 in .github/workflows/ci.yml and pyproject.toml; suite runs at exactly 100% line coverage.}
  action_exceptions: {status: exempt, comment: Read-only integration; mirrors the action_setup exemption.}
  docs_configuration_parameters: {status: done, comment: 'README Configuration section: direction filter, scan interval 30s–10min, upcoming-trains 1–5, stops-at filter (incl. All sentinel).'}
  docs_installation_parameters: {status: done, comment: README Installation + Configuration sections document every setup-flow parameter; no API key or credentials required.}
  integration_owner: {status: done, comment: 'manifest.json declares codeowners ["@Gekko47"].'}
  reauthentication_flow: {status: exempt, comment: Keyless public RTPI API; the rule's own exception clause applies.}

  # Gold
  diagnostics: {status: done, comment: diagnostics.py implements async_get_config_entry_diagnostics; async_redact_data + _mask_identifier applied. Edge cases pinned in test_diagnostics.py.}
  docs_examples: {status: done, comment: 'README "Example automations" section: departure alert + delay notification.'}
  docs_use_cases: {status: done, comment: 'README "Use cases" section: commuter dashboard, delay alerts, presence-based reminders, service-health awareness.'}
  docs_troubleshooting: {status: done, comment: 'README "Troubleshooting" section: API downtime, SETUP_RETRY, overnight empties, persistent empty-data repair issue, diagnostics.'}
  entity_device_class: {status: done, comment: next_train_due is TIMESTAMP (ISO 8601 datetime), next_train_delay is DURATION + UnitOfTime.MINUTES + MEASUREMENT, next_train_destination is classless. Connectivity binary sensor uses BinarySensorDeviceClass.CONNECTIVITY. See docs/architecture.md §15.}
  exception_translations: {status: exempt, comment: No service actions and no HomeAssistantError raised to users (asserted by test_translations.py::test_no_homeassistanterror_raised_to_users); every user-facing failure surface is translation-keyed.}
  icon_translations: {status: done, comment: icons.json defines per-entity icons (next_train_due, destination, delay, connectivity, rebuild button). Alignment pinned by test_icons.py.}
  repair_issues: {status: done, comment: coordinator.py raises ir.async_create_issue with translation_key=empty_data_during_service_hours after EMPTY_DATA_ISSUE_THRESHOLD consecutive empty polls in Dublin service hours; cleared on the first data-bearing refresh or when the shared API-health monitor confirms reachability. See docs/architecture.md §9. tests in test_coordinator.py and test_init.py.}
  devices: {status: done, comment: entity.py sets _attr_device_info on the per-station sensors with identifiers (DOMAIN + entry.unique_id) and entry_type=SERVICE; the two integration-level entities share a fixed-identifier "Irish Rail Services" device. See docs/architecture.md §6, §7.}
  discovery: {status: exempt, comment: Keyless cloud XML API; no discoverable hardware or network protocol.}
  discovery_update_info: {status: exempt, comment: Same as discovery; no IP/host configuration.}
  docs_data_update: {status: done, comment: 'README "Triggers (data updates)" section: immediate first refresh, 60s default polling, user-configurable 30s–10min, failure/retry behaviour.'}
  docs_known_limitations: {status: done, comment: README "Known Limitations" section lists genuine limitations (unofficial API downtime, plain HTTP/HTTPS, RoI/NI scope, stops-at extra requests) without duplicating bug-tracker material.}
  docs_supported_devices: {status: exempt, comment: Monitors a national rail timetable service; no device model or hardware compatibility matrix to document.}
  docs_supported_functions: {status: done, comment: 'README "Entities", "Actions", "Triggers", "Conditions" sections cover every sensor (meaning, device class, unit, state class), attribute table, and behaviour.'}
  dynamic_devices: {status: done, comment: Per-station devices are created on entry setup; the two integration-level entities are static and live on the fixed-identifier Services device. See docs/architecture.md §6.}
  entity_category: {status: done, comment: Per-station sensors are primary (default category). Connectivity binary_sensor is DIAGNOSTIC, rebuild button is CONFIG; both share the fixed-identifier Services device; _runtime.py purges orphan device rows on ownership transfer. See docs/architecture.md §7, §11.}
  entity_disabled_by_default: {status: done, comment: 'sensor.py + entity.py: per-station sensors are the integration''s core value, update ~1/min, no auxiliary diagnostics; enabling by default is correct.'}
  entity_translations: {status: done, comment: Every sensor sets _attr_translation_key with has_entity_name=True; strings.json + translations/en.json define a name per key. Alignment enforced by test_icons.py and test_translations.py.}
  stale_devices: {status: done, comment: entity.py binds each service device to exactly one config entry via identifiers=(DOMAIN, entry.unique_id); HA registry cleanup removes the device when the entry is removed. One device per entry ⇒ no hub list to sweep.}

  # Platinum — three rules, all satisfied without an external PyPI package;
  # the async client lives in the integration package itself
  # (client.py, request_gate.py, models.py, errors.py, lib_const.py).
  # The PyPI name "pyirishrail" is owned by an unrelated project and
  # the v0.3.0 baseline kept the client vendored rather than published.
  async_dependency: {status: done, comment: manifest.json declares zero third-party runtime requirements; every outbound call is await session.get(...) on the injected aiohttp session (client.py::IrishRailClient._request); XML parsed by stdlib xml.etree.ElementTree on bytes already fetched, guarded by an explicit pre-parse DTD/entity policy (client.py::_DTD_KEYWORDS). See docs/architecture.md §4.}
  inject_websession: {status: done, comment: client.py::IrishRailClient.__init__ accepts an injected aiohttp.ClientSession; __init__.py and config_flow.py pass async_get_clientsession(hass); the health probe and rebuild button reuse the entry's client.}
  strict_typing: {status: done, comment: '(1) type IrishRailConfigEntry = ConfigEntry[IrishRailRuntimeData] in types.py, used in every entry-taking signature. (2) CI mypy gate in .github/workflows/ci.yml runs mypy custom_components/irish_rail tests/components/irish_rail with strict = true. (3) py.typed ships vendored per PEP-561. No # type: ignore remains.'}