# Irish Rail — HA Quality Scale (Bronze/Silver/Gold/Platinum).
# Rule IDs: underscore form of official hyphenated names.
#   done   — file/function pointer in comment; rationale in docs/architecture.md.
#   exempt — rule exception clause; one-line justification.

rules:
  # Bronze
  action_setup: {status: done, comment: 'button.py::async_setup_entry registers irish_rail.rebuild_stops_matrix and the matching button entity; described in services.yaml.'}
  appropriate_polling: {status: done, comment: const.py DEFAULT_SCAN_INTERVAL (60s) via DataUpdateCoordinator; user-adjustable 30s–10min via options flow. See docs/architecture.md §9.}
  brands: {status: done, comment: brand/icon.png, brand/logo.png, brand/small.png ship with the integration.}
  common_modules: {status: done, comment: Framework-agnostic client modules (client.py, request_gate.py, models.py, errors.py, lib_const.py) sit alongside the HA integration code; shared entity base in entity.py; types.py holds IrishRailRuntimeData + IrishRailConfigEntry. See docs/architecture.md §1, §4.}
  config_flow_test_coverage: {status: done, comment: tests/components/irish_rail/test_config_flow.py covers success, cannot_connect, invalid_station, duplicate-abort paths.}
  config_flow: {status: done, comment: config_flow.py::IrishRailConfigFlow.async_step_user (+ station_pick, filter_options, directions, stops_at steps).}
  reconfiguration_flow: {status: done, comment: IrishRailConfigFlow.async_step_reconfigure in config_flow.py; same-direction preserves unique ID. See docs/architecture.md §8.}
  dependency_transparency: {status: done, comment: 'manifest.json requirements: []; XML parsed by stdlib xml.etree.ElementTree; transport is aiohttp (HA core, no listing). Pinned by a test asserting requirements is empty. See docs/architecture.md §4.'}
  docs_actions: {status: exempt, comment: 'The integration registers no actions. It exposes one service (rebuild_stops_matrix, documented in the README), which is not a Quality Scale action.'}
  docs_conditions: {status: exempt, comment: 'The integration registers no conditions. A binary sensor is not a Quality Scale condition; the connectivity sensor is documented in the README as an entity, not as a condition.'}
  docs_high_level_description: {status: done, comment: 'README opening section describes the service and the entities it creates.'}
  docs_installation_instructions: {status: done, comment: 'README "Install" section (HACS + manual); no API key needed.'}
  docs_removal_instructions: {status: done, comment: 'README "Removal" section.'}
  docs_triggers: {status: exempt, comment: 'The integration registers no triggers; it is started by a config entry and polls on a timer. The polling cadence is documented in the README, but that is not a trigger.'}
  entity_event_setup: {status: done, comment: 'No entity subscribes to bus events or state changes. The per-station sensors inherit CoordinatorEntity''s listener lifecycle (entity.py); the connectivity binary sensor adds a monitor listener in async_added_to_hass and removes it via self.async_on_remove (binary_sensor.py). The rebuild button schedules through hass.async_create_background_task (button.py).'}
  entity_unique_id: {status: done, comment: entity.py builds unique IDs from config_entry.unique_id + per-entity suffix; the two integration-level entities use fixed identifiers. See docs/architecture.md §6.}
  has_entity_name: {status: done, comment: entity.py sets _attr_has_entity_name = True on the base class.}
  runtime_data: {status: done, comment: '__init__.py::async_setup_entry stores IrishRailRuntimeData (client + coordinator) on entry.runtime_data; types.py defines the container and IrishRailConfigEntry alias.'}
  test_before_configure: {status: done, comment: config_flow.py validates connection by fetching the station list before allowing entry creation; failures map to cannot_connect.}
  test_before_setup: {status: done, comment: __init__.py::async_setup_entry awaits async_config_entry_first_refresh() before forwarding platforms, raising ConfigEntryNotReady on failure. See docs/architecture.md §12.}
  unique_config_entry: {status: done, comment: 'config_flow.py sets unique_id = "{station_code}_{direction}"; reconfigures to the same direction preserve the existing ID. See docs/architecture.md §8.'}

  # Silver
  parallel_updates: {status: done, comment: sensor.py declares PARALLEL_UPDATES = 0; coordinator-based read-only platform, per-entity updates are pure property reads. See docs/architecture.md §15.}
  log_when_unavailable: {status: done, comment: coordinator.py raises UpdateFailed on IrishRailError; the built-in DataUpdateCoordinator handles the success-to-failure and recovery log transitions. Pinned by transition tests in test_coordinator.py.}
  entity_unavailable: {status: done, comment: Entities extend CoordinatorEntity so availability follows the coordinator result; test_sensor.py asserts the IrishRailError -> UpdateFailed -> unavailable path and recovery.}
  config_entry_unloading: {status: done, comment: __init__.py::async_unload_entry calls async_unload_platforms and releases the shared singletons; the update listener is registered through entry.async_on_unload. See docs/architecture.md §12.}
  test_coverage: {status: done, comment: CI gate --cov-branch --cov-fail-under=100 in .github/workflows/ci.yml and pyproject.toml, over custom_components/irish_rail and scripts/; the suite runs at exactly 100% line and branch coverage. pytest-timeout bounds a hung test instead of hanging the run.}
  action_exceptions: {status: done, comment: 'The rebuild_stops_matrix service raises HomeAssistantError(translation_key=rebuild_already_running) when a sweep is already in flight; the sweep itself never raises - a failure is recorded in the button attributes and a persistent notification (button.py). Pinned by test_button.py::test_concurrent_service_call_raises_the_translated_error.'}
  docs_configuration_parameters: {status: done, comment: 'README "Configuration" section: direction filter, scan interval 30s–10min, stops-at filter (incl. the All sentinel).'}
  docs_installation_parameters: {status: done, comment: README Installation + Configuration sections document every setup-flow parameter; no API key or credentials required.}
  integration_owner: {status: done, comment: 'manifest.json declares codeowners ["@Gekko47"].'}
  reauthentication_flow: {status: exempt, comment: Keyless public RTPI API; the rule's own exception clause applies.}

  # Gold
  diagnostics: {status: done, comment: diagnostics.py implements async_get_config_entry_diagnostics; async_redact_data + _mask_identifier applied. Edge cases pinned in test_diagnostics.py.}
  docs_examples: {status: done, comment: 'README "Examples" section: departure alert and following-train alert automations.'}
  docs_use_cases: {status: done, comment: 'README "Sensors" and "Behaviour" sections: commuter dashboard entities, delay alerts, service-health awareness via the connectivity binary sensor.'}
  docs_troubleshooting: {status: done, comment: 'README "Troubleshooting" section: API downtime, setup retry, overnight empties, the persistent empty-data repair issue, and diagnostics.'}
  entity_device_class: {status: done, comment: 'next_train_due and following_train_due are both SensorDeviceClass.TIMESTAMP (sensor.py); the connectivity binary sensor uses BinarySensorDeviceClass.CONNECTIVITY. See docs/architecture.md §15.'}
  exception_translations: {status: done, comment: 'The only exception raised toward a user is HomeAssistantError(translation_key=rebuild_already_running) from the rebuild button (button.py); its wording lives under "exceptions" in strings.json and translations/en.json. Every raised HomeAssistantError is asserted to carry a translation_key by test_translations.py::test_exception_keys_raised_toward_users_resolve.'}
  icon_translations: {status: done, comment: 'icons.json defines per-entity icons (sensor.next_train_due, sensor.following_train_due, binary_sensor.status, button.rebuild_stops_matrix). Alignment pinned by test_icons.py.'}
  repair_issues: {status: done, comment: coordinator.py raises ir.async_create_issue with translation_key=empty_data_during_service_hours after EMPTY_DATA_ISSUE_THRESHOLD consecutive empty polls in Dublin service hours; cleared on the first data-bearing refresh, or — only for an entry applying neither filter (coordinator.py::is_unfiltered) — when the shared API-health monitor confirms reachability. A filtered entry is never cleared that way, because the probe polls a different, unfiltered station. See docs/architecture.md §9. tests in test_coordinator.py, test_health_suppression.py and test_init.py.}
  devices: {status: done, comment: entity.py sets _attr_device_info on the per-station sensors with identifiers (DOMAIN + entry.unique_id) and entry_type=SERVICE; the two integration-level entities share the fixed-identifier "Irish Rail Services" device, which is created only while at least one entry is loaded. See docs/architecture.md §6, §11.}
  discovery: {status: exempt, comment: Keyless cloud XML API; no discoverable hardware or network protocol.}
  discovery_update_info: {status: exempt, comment: Same as discovery; no IP/host configuration.}
  docs_data_update: {status: done, comment: 'README "Behaviour" section: immediate first refresh, 60s default polling, user-configurable 30s–10min, failure/retry and adaptive-backoff behaviour.'}
  docs_known_limitations: {status: done, comment: 'README "Known limitations" section lists the unofficial API, rate-limiting guidance, and the stops-at extra-request cost without duplicating bug-tracker material.'}
  docs_supported_devices: {status: exempt, comment: Monitors a national rail timetable service; no device model or hardware compatibility matrix to document.}
  docs_supported_functions: {status: done, comment: 'README "Sensors" section covers every sensor (meaning, device class, attributes); the "Examples" section covers the service and automation entry points.'}
  dynamic_devices: {status: done, comment: Per-station devices are created on entry setup. The Services device is *removed* again with the last loaded entry and re-created under a new owner on promotion, so its lifetime is dynamic too; _runtime.py::elect_provider / async_promote_provider drive the transfer. Pinned by tests/components/irish_rail/test_init.py::test_globals_survive_the_owner_being_removed. See docs/architecture.md §11.}
  entity_category: {status: done, comment: 'Per-station sensors are primary (default category). Connectivity binary_sensor is DIAGNOSTIC, rebuild button is CONFIG; both share the fixed-identifier Services device, which no per-station device carries. _runtime.py::_purge_orphan_global_entities clears the departing owner''s rows on every ownership transfer. See docs/architecture.md §11.'}
  entity_disabled_by_default: {status: done, comment: 'sensor.py + entity.py: per-station sensors are the integration''s core value, update ~1/min, no auxiliary diagnostics; enabling by default is correct.'}
  entity_translations: {status: done, comment: Every sensor sets _attr_translation_key with has_entity_name=True; strings.json + translations/en.json define a name per key. Alignment enforced by test_icons.py and test_translations.py.}
  stale_devices: {status: done, comment: entity.py binds each per-station device to exactly one config entry via identifiers=(DOMAIN, entry.unique_id), so HA registry cleanup removes it with the entry. The Services device has a fixed identifier and outlives any single entry: _runtime.py::_purge_orphan_global_entities removes it and its two entity rows whenever the owner changes, so a transfer never leaves a stale device behind. See docs/architecture.md §11.}

  # Platinum
  async_dependency: {status: done, comment: 'manifest.json requirements: []; aiohttp via injected session; stdlib xml.etree.ElementTree with DTD/entity guard. See docs/architecture.md §4.'}
  inject_websession: {status: done, comment: 'client.py::IrishRailClient.__init__ accepts an injected aiohttp.ClientSession; __init__.py and config_flow.py pass async_get_clientsession(hass); the health probe and rebuild button reuse the entry client (rebound on reload via ConnectivityMonitor.rebind_client).'}
  strict_typing: {status: done, comment: '(1) type IrishRailConfigEntry = ConfigEntry[IrishRailRuntimeData] in types.py, used in every entry-taking signature. (2) CI mypy gate in .github/workflows/ci.yml runs mypy on custom_components/irish_rail, tests/components/irish_rail, tests/test_scripts.py and scripts with strict = true. (3) py.typed ships vendored per PEP-561. No # type: ignore remains in the integration source.'}